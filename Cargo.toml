[package]
name = "containersafe"
version = "0.18.0"
edition = "2021"
build = false
default-run = "containersafe"

[features]
default = ["server-management"]
server-management = ["dep:russh", "dep:tokio", "dep:keyring", "dep:directories", "dep:aes", "dep:cbc", "dep:md5"]

[[bin]]
name = "containersafe"
path = "src/main.rs"
required-features = ["server-management"]

[[bin]]
name = "containersafe-agent"
path = "src/bin/containersafe-agent.rs"

[[test]]
name = "config_override"
required-features = ["server-management"]

[[test]]
name = "ssh_integration"
required-features = ["server-management"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = { version = "6", optional = true }
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
keyring = { version = "3", optional = true, features = ["windows-native", "apple-native", "sync-secret-service"] }
russh = { version = "=0.64.1", optional = true, default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time", "net", "sync"] }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true }
md5 = { version = "0.8", optional = true }
