[package]
name = "containersafe"
version = "0.9.0"
edition = "2021"
build = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
