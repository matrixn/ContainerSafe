[package]
name = "containersafe-native"
version = "0.18.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "=1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

containersafe = { path = ".." }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[build-dependencies]
slint-build = "=1.18.1"
